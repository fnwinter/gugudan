<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한글 타자 연습</title>
<style>
  :root {
    --bg: #fdf8ee;
    --ink: #2b2b2b;
    --accent: #3b82f6;
    --ok: #16a34a;
    --bad: #dc2626;
    --box: #ffffff;
    --muted: #6b7280;
    /* 손가락별 키 색 */
    --f1: #fde2e4;  /* 새끼 */
    --f2: #fff1c1;  /* 약지 */
    --f3: #d8f3dc;  /* 중지 */
    --f4: #dbeafe;  /* 검지 */
    --f5: #ede9fe;  /* 엄지 */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", "Malgun Gothic", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    user-select: none;
  }

  button {
    font-size: clamp(16px, 3vw, 22px);
    font-weight: 700;
    padding: 8px 18px;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    font-family: inherit;
  }
  button:active { transform: scale(.97); }

  /* 상단 */
  .top {
    width: 100%;
    max-width: 1000px;
    padding: 16px 16px 0;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
  }
  .tabs {
    display: flex;
    background: #e5e7eb;
    border-radius: 14px;
    padding: 4px;
  }
  .tabs button { background: transparent; color: var(--ink); }
  .tabs button.on { background: var(--box); color: var(--accent); box-shadow: 0 2px 4px rgba(0,0,0,.1); }
  #rowSelect, #storySelect {
    font-size: clamp(16px, 3vw, 20px);
    font-family: inherit;
    font-weight: 700;
    padding: 8px 10px;
    border: 3px solid #9ca3af;
    border-radius: 12px;
    background: var(--box);
  }
  .stats {
    margin-left: auto;
    display: flex;
    gap: 16px;
    font-size: clamp(16px, 3vw, 22px);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  /* 연습 글 */
  main {
    flex: 1;
    width: 100%;
    max-width: 1000px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 20px;
  }
  .lines {
    background: var(--box);
    border-radius: 20px;
    box-shadow: 0 6px 0 rgba(0,0,0,.08);
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .line {
    font-size: clamp(28px, 5.5vw, 48px);
    font-weight: 700;
    min-height: 1.4em;
    white-space: pre-wrap;
    word-break: break-all;
    letter-spacing: .04em;
  }
  #target { color: var(--ink); }
  #target .cur { background: #fef3c7; border-radius: 6px; }
  #typed { color: var(--accent); border-top: 3px dashed #e5e7eb; padding-top: 14px; }
  #typed .ok { color: var(--ok); }
  #typed .bad { color: var(--bad); background: #fee2e2; border-radius: 6px; }
  #typed .now { color: var(--accent); }
  .caret {
    display: inline-block;
    width: 3px;
    height: 1.1em;
    background: var(--accent);
    vertical-align: -0.15em;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  #progress { font-size: clamp(16px, 3vw, 22px); font-weight: 700; color: var(--muted); }
  #progress:empty { display: none; }
  #target.finish { color: var(--ok); }
  #nextText { font-size: clamp(18px, 3vw, 24px); color: var(--muted); }
  .hint { font-size: clamp(14px, 2.5vw, 18px); color: var(--muted); text-align: center; }

  /* 키보드 */
  .keyboard {
    width: 100%;
    background: #d1d5db;
    border-radius: 16px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .krow { display: flex; gap: 6px; }
  .key {
    flex: 1 1 0;
    min-width: 0;
    height: clamp(40px, 7vw, 64px);
    background: var(--box);
    border-radius: 8px;
    box-shadow: 0 3px 0 #9ca3af;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(15px, 3vw, 28px);
    font-weight: 700;
    cursor: pointer;
    transition: transform .05s, box-shadow .05s;
  }
  .key.fn { font-size: clamp(10px, 1.6vw, 16px); color: var(--muted); background: #f3f4f6; }
  .key .sh { position: absolute; top: 2px; left: 5px; font-size: .5em; color: var(--muted); }
  .key .en { position: absolute; bottom: 2px; right: 5px; font-size: .4em; color: #9ca3af; font-weight: 400; }
  .key.home::after {
    content: "";
    position: absolute;
    bottom: 6px;
    width: 30%;
    height: 3px;
    border-radius: 2px;
    background: var(--muted);
  }
  .key.f1 { background: var(--f1); }
  .key.f2 { background: var(--f2); }
  .key.f3 { background: var(--f3); }
  .key.f4 { background: var(--f4); }
  .key.f5 { background: var(--f5); }
  .key.guide { outline: 4px solid var(--accent); outline-offset: -2px; animation: pulse 1s infinite; }
  .key.guide.err { outline-color: var(--bad); }
  @keyframes pulse { 50% { outline-color: transparent; } }
  .key.down {
    transform: translateY(3px);
    box-shadow: 0 0 0 #9ca3af;
    background: var(--accent);
    color: #fff;
  }
  .key.down .sh, .key.down .en { color: #e0e7ff; }
  .key.sticky { background: #bfdbfe; }

  .home-btn {
    display: inline-block;
    font-size: clamp(16px, 3vw, 22px);
    font-weight: 700;
    padding: 8px 16px;
    border-radius: 12px;
    background: #e5e7eb;
    color: var(--ink);
    text-decoration: none;
    white-space: nowrap;
  }
  .home-btn:active { transform: scale(.97); }
</style>
</head>
<body>
  <div class="top">
    <a class="home-btn" href="index.html">🏠 처음으로</a>
    <div class="tabs">
      <button data-mode="jari" class="on">자리</button>
      <button data-mode="word">낱말</button>
      <button data-mode="sentence">문장</button>
      <button data-mode="story">긴 글</button>
    </div>
    <select id="rowSelect">
      <option value="mid">가운데 줄</option>
      <option value="top">윗줄</option>
      <option value="bottom">아랫줄</option>
      <option value="all">전체</option>
    </select>
    <select id="storySelect" style="display:none"></select>
    <div class="stats">
      <span>⚡ <span id="speed">0</span>타</span>
      <span>🎯 <span id="accuracy">100</span>%</span>
      <span>✅ <span id="lineCount">0</span>줄</span>
    </div>
  </div>

  <main>
    <div class="lines">
      <div id="progress"></div>
      <div class="line" id="target"></div>
      <div class="line" id="typed"></div>
      <div id="nextText"></div>
    </div>
    <div class="keyboard" id="keyboard"></div>
    <div class="hint">한/영 전환 없이 그대로 치면 한글이 써져요 · 깜빡이는 키를 눌러 보세요 · 화면의 키를 눌러도 돼요</div>
  </main>

<script>
  // ===== 두벌식 자판 =====
  // [코드, 보통, Shift, 영문 표시, 너비, 손가락]
  const ROWS = [
    [['Backquote','`','~','',1,1],['Digit1','1','!','',1,1],['Digit2','2','@','',1,2],['Digit3','3','#','',1,3],
     ['Digit4','4','$','',1,4],['Digit5','5','%','',1,4],['Digit6','6','^','',1,4],['Digit7','7','&','',1,4],
     ['Digit8','8','*','',1,3],['Digit9','9','(','',1,2],['Digit0','0',')','',1,1],['Minus','-','_','',1,1],
     ['Equal','=','+','',1,1],['Backspace','⌫ 지우기','','',2,0]],
    [['Tab','Tab','','',1.5,0],['KeyQ','ㅂ','ㅃ','Q',1,1],['KeyW','ㅈ','ㅉ','W',1,2],['KeyE','ㄷ','ㄸ','E',1,3],
     ['KeyR','ㄱ','ㄲ','R',1,4],['KeyT','ㅅ','ㅆ','T',1,4],['KeyY','ㅛ','','Y',1,4],['KeyU','ㅕ','','U',1,4],
     ['KeyI','ㅑ','','I',1,3],['KeyO','ㅐ','ㅒ','O',1,2],['KeyP','ㅔ','ㅖ','P',1,1],['BracketLeft','[','{','',1,1],
     ['BracketRight',']','}','',1,1],['Backslash','\\','|','',1.5,1]],
    [['CapsLock','Caps','','',1.8,0],['KeyA','ㅁ','','A',1,1],['KeyS','ㄴ','','S',1,2],['KeyD','ㅇ','','D',1,3],
     ['KeyF','ㄹ','','F',1,4],['KeyG','ㅎ','','G',1,4],['KeyH','ㅗ','','H',1,4],['KeyJ','ㅓ','','J',1,4],
     ['KeyK','ㅏ','','K',1,3],['KeyL','ㅣ','','L',1,2],['Semicolon',';',':','',1,1],['Quote',"'",'"','',1,1],
     ['Enter','Enter','','',2.2,0]],
    [['ShiftLeft','Shift','','',2.4,0],['KeyZ','ㅋ','','Z',1,1],['KeyX','ㅌ','','X',1,2],['KeyC','ㅊ','','C',1,3],
     ['KeyV','ㅍ','','V',1,4],['KeyB','ㅠ','','B',1,4],['KeyN','ㅜ','','N',1,4],['KeyM','ㅡ','','M',1,4],
     ['Comma',',','<','',1,3],['Period','.','>','',1,2],['Slash','/','?','',1,1],['ShiftRight','Shift','','',2.6,0]],
    [['Space','띄어쓰기','','',8,5]],
  ];
  const TYPEABLE = {};   // 코드 → [보통 글자, Shift 글자]
  const KEY_OF = {};     // 글자 → { code, shift }
  ROWS.flat().forEach(([code, normal, shift, , , finger]) => {
    if (finger === 0) return;
    const n = code === 'Space' ? ' ' : normal;
    const s = code === 'Space' ? ' ' : (shift || normal);
    TYPEABLE[code] = [n, s];
    if (!(n in KEY_OF)) KEY_OF[n] = { code, shift: false };
    if (shift && !(shift in KEY_OF)) KEY_OF[shift] = { code, shift: true };
  });

  // ===== 한글 조합 =====
  const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
  const JUNG = 'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ';
  const JONG = ['', ...'ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ'];
  const JUNG_SPLIT = { 'ㅘ':'ㅗㅏ', 'ㅙ':'ㅗㅐ', 'ㅚ':'ㅗㅣ', 'ㅝ':'ㅜㅓ', 'ㅞ':'ㅜㅔ', 'ㅟ':'ㅜㅣ', 'ㅢ':'ㅡㅣ' };
  const JONG_SPLIT = { 'ㄳ':'ㄱㅅ', 'ㄵ':'ㄴㅈ', 'ㄶ':'ㄴㅎ', 'ㄺ':'ㄹㄱ', 'ㄻ':'ㄹㅁ', 'ㄼ':'ㄹㅂ',
                       'ㄽ':'ㄹㅅ', 'ㄾ':'ㄹㅌ', 'ㄿ':'ㄹㅍ', 'ㅀ':'ㄹㅎ', 'ㅄ':'ㅂㅅ' };
  const flip = o => Object.fromEntries(Object.entries(o).map(([k, v]) => [v, k]));
  const JUNG_PAIR = flip(JUNG_SPLIT);
  const JONG_PAIR = flip(JONG_SPLIT);
  const isCons = t => CHO.includes(t);
  const isVowel = t => JUNG.includes(t);

  // 글자 → 눌러야 할 키 순서 (예: "닭" → ㄷ ㅏ ㄹ ㄱ)
  function toKeys(text) {
    const keys = [];
    for (const ch of text) {
      const c = ch.charCodeAt(0) - 0xAC00;
      if (c >= 0 && c < 11172) {
        const jung = JUNG[Math.floor(c % 588 / 28)];
        const jong = JONG[c % 28];
        keys.push(CHO[Math.floor(c / 588)]);
        keys.push(...(JUNG_SPLIT[jung] || jung));
        if (jong) keys.push(...(JONG_SPLIT[jong] || jong));
      } else {
        keys.push(ch);
      }
    }
    return keys;
  }

  // 누른 키 순서 → 글자 배열 (한글 입력기처럼 조합)
  function compose(keys) {
    const out = [];
    let cur = null;  // { cho, jung, jong }
    const flush = () => {
      if (!cur) return;
      if (cur.cho && cur.jung) {
        out.push(String.fromCharCode(0xAC00 +
          (CHO.indexOf(cur.cho) * 21 + JUNG.indexOf(cur.jung)) * 28 + JONG.indexOf(cur.jong || '')));
      } else {
        out.push(cur.cho || cur.jung);
      }
      cur = null;
    };
    keys.forEach((t, i) => {
      const next = keys[i + 1];
      if (isCons(t)) {
        // 다음 키가 모음이면 새 글자의 첫소리, 아니면 받침
        if (cur && cur.cho && cur.jung && !(next && isVowel(next))) {
          if (!cur.jong && JONG.includes(t)) { cur.jong = t; return; }
          if (cur.jong && JONG_PAIR[cur.jong + t]) { cur.jong = JONG_PAIR[cur.jong + t]; return; }
        }
        flush();
        cur = { cho: t };
      } else if (isVowel(t)) {
        if (cur && cur.cho && !cur.jung) { cur.jung = t; return; }
        if (cur && cur.jung && !cur.jong && JUNG_PAIR[cur.jung + t]) { cur.jung = JUNG_PAIR[cur.jung + t]; return; }
        flush();
        cur = { jung: t };
      } else {
        flush();
        out.push(t);
      }
    });
    flush();
    return out;
  }

  // ===== 연습 글 =====
  const JARI = {
    mid: 'ㅁㄴㅇㄹㅎㅗㅓㅏㅣ',
    top: 'ㅂㅈㄷㄱㅅㅛㅕㅑㅐㅔ',
    bottom: 'ㅋㅌㅊㅍㅠㅜㅡ',
  };
  JARI.all = JARI.mid + JARI.top + JARI.bottom;
  const WORDS = `사과 바나나 포도 딸기 수박 학교 친구 선생님 엄마 아빠 동생 하늘 바다 구름 나무 꽃
    강아지 고양이 토끼 사자 호랑이 기차 비행기 자동차 연필 지우개 공책 가방 의자 책상 우유 김밥
    라면 과자 사탕 노래 그림 운동 축구 야구 컴퓨터 모자 신발 양말 우산 시계 거울 달 별 해 눈 비
    바람 봄 여름 가을 겨울 행복 사랑 꿈 무지개 도서관 놀이터 병원 시장 우체국`.split(/\s+/);
  const SENTENCES = [
    '나는 학교에 갑니다.',
    '오늘은 날씨가 맑아요.',
    '우리 가족은 모두 네 명이에요.',
    '친구와 함께 놀이터에서 놀았어요.',
    '엄마가 맛있는 밥을 해 주셨어요.',
    '하늘에 예쁜 무지개가 떴어요.',
    '강아지가 꼬리를 흔들어요.',
    '나는 책 읽기를 좋아해요.',
    '겨울에는 눈사람을 만들어요.',
    '아침에 일찍 일어났어요.',
    '동생과 사이좋게 지내요.',
    '선생님께 인사를 했어요.',
    '여름에는 바다에 가고 싶어요.',
    '고맙습니다, 사랑합니다.',
    '천천히 정확하게 쳐 보세요.',
    '열심히 연습하면 빨라져요!',
    '오늘 저녁은 무엇을 먹을까?',
    '꽃밭에 나비가 날아다녀요.',
  ];
  // 긴 글: 한 줄씩 차례대로 침
  const STORIES = [
    { group: '노래', title: '애국가', text: `
동해 물과 백두산이 마르고 닳도록
하느님이 보우하사 우리나라 만세
무궁화 삼천리 화려 강산
대한 사람 대한으로 길이 보전하세
남산 위에 저 소나무 철갑을 두른 듯
바람 서리 불변함은 우리 기상일세
무궁화 삼천리 화려 강산
대한 사람 대한으로 길이 보전하세
가을 하늘 공활한데 높고 구름 없이
밝은 달은 우리 가슴 일편단심일세
무궁화 삼천리 화려 강산
대한 사람 대한으로 길이 보전하세
이 기상과 이 맘으로 충성을 다하여
괴로우나 즐거우나 나라 사랑하세
무궁화 삼천리 화려 강산
대한 사람 대한으로 길이 보전하세` },
    { group: '이솝 우화', title: '토끼와 거북이', text: `
옛날 옛날 숲속에 토끼와 거북이가 살았어요.
토끼는 느릿느릿 걷는 거북이를 늘 놀렸어요.
"거북아, 너는 왜 그렇게 느리니?"
화가 난 거북이가 말했어요.
"그럼 저 언덕까지 달리기 시합을 하자!"
시합이 시작되자 토끼는 깡충깡충 앞서 나갔어요.
한참을 달린 토끼가 뒤를 돌아보았어요.
거북이는 아직 저 멀리 있었어요.
"조금 자고 가도 이기겠지."
토끼는 나무 아래에서 쿨쿨 잠이 들었어요.
그동안 거북이는 쉬지 않고 엉금엉금 걸었어요.
토끼가 깼을 때 거북이는 벌써 언덕 위에 있었어요.
천천히 가도 꾸준히 가면 이길 수 있어요.` },
    { group: '이솝 우화', title: '개미와 베짱이', text: `
뜨거운 여름날, 개미들은 부지런히 먹이를 날랐어요.
베짱이는 나무 그늘에서 노래만 불렀어요.
"개미야, 이렇게 더운데 좀 쉬면서 놀자."
"겨울이 오기 전에 먹이를 모아 두어야 해."
베짱이는 개미들을 보며 깔깔 웃었어요.
시간이 흘러 차가운 겨울이 찾아왔어요.
하얀 눈이 내려 먹을 것을 찾을 수 없었어요.
배가 고픈 베짱이는 개미네 집 문을 두드렸어요.
"개미야, 먹을 것 좀 나누어 줄 수 있니?"
개미들은 베짱이에게 따뜻한 음식을 나누어 주었어요.
베짱이는 다음 여름부터 열심히 일하기로 했어요.` },
    { group: '이솝 우화', title: '양치기 소년', text: `
어느 마을에 양을 치는 소년이 살았어요.
소년은 하루 종일 양만 지키느라 심심했어요.
"늑대다! 늑대가 나타났어요!"
마을 사람들이 깜짝 놀라 달려왔어요.
하지만 늑대는 없었고 소년은 깔깔 웃었어요.
다음 날에도 소년은 똑같은 거짓말을 했어요.
사람들은 또 달려왔다가 화를 내며 돌아갔어요.
며칠 뒤, 정말로 늑대가 나타났어요.
"늑대다! 이번엔 진짜예요! 도와주세요!"
하지만 아무도 소년의 말을 믿지 않았어요.
늑대는 양들을 모두 잡아가 버렸어요.
거짓말을 자꾸 하면 아무도 믿어 주지 않아요.` },
    { group: '이솝 우화', title: '해님과 바람', text: `
어느 날 바람이 해님에게 자랑을 했어요.
"내가 너보다 훨씬 힘이 세!"
그때 외투를 입은 나그네가 길을 지나갔어요.
"저 나그네의 외투를 먼저 벗기는 쪽이 이기는 거야."
바람이 먼저 휘잉휘잉 세게 불었어요.
나그네는 추워서 외투를 더 꼭 여몄어요.
이번에는 해님이 따뜻한 햇볕을 비추었어요.
나그네는 땀을 닦으며 스스로 외투를 벗었어요.
힘보다 따뜻한 마음이 더 강하답니다.` },
    { group: '전래 동화', title: '해와 달이 된 오누이', text: `
옛날 깊은 산골에 엄마와 오누이가 살았어요.
어느 날 엄마는 떡을 팔고 고개를 넘어오고 있었어요.
"떡 하나 주면 안 잡아먹지!"
무서운 호랑이가 나타나 떡을 모두 빼앗아 먹었어요.
호랑이는 엄마 옷을 입고 오누이의 집으로 갔어요.
"얘들아, 엄마 왔다. 문 열어라."
문틈으로 보니 털이 숭숭 난 호랑이 손이었어요.
오누이는 뒷문으로 도망쳐 높은 나무 위로 올라갔어요.
"하느님, 저희를 살리시려면 튼튼한 동아줄을 내려 주세요."
하늘에서 튼튼한 동아줄이 내려왔어요.
호랑이도 동아줄을 빌었지만 썩은 줄이 내려왔어요.
호랑이는 줄이 끊어져 수수밭에 떨어지고 말았어요.
하늘로 올라간 오빠는 달이 되고, 동생은 해가 되었어요.` },
    { group: '전래 동화', title: '흥부와 놀부', text: `
옛날에 욕심 많은 형 놀부와 착한 동생 흥부가 살았어요.
놀부는 부모님의 재산을 혼자 다 가지고 흥부를 쫓아냈어요.
어느 봄날, 흥부는 다리가 부러진 제비를 정성껏 고쳐 주었어요.
다음 해 봄, 제비가 박씨 하나를 물어다 주었어요.
가을이 되자 지붕 위에 커다란 박이 주렁주렁 열렸어요.
"슬근슬근 톱질하세!"
박 속에서 쌀과 금은보화가 쏟아져 나왔어요.
이 소식을 들은 놀부는 일부러 제비 다리를 부러뜨렸어요.
놀부도 제비가 준 박씨를 심어 커다란 박을 얻었어요.
그런데 박 속에서는 도깨비들이 우르르 나왔어요.
놀부는 그제야 잘못을 뉘우쳤어요.
착한 흥부는 형을 용서하고 사이좋게 살았어요.` },
    { group: '전래 동화', title: '금도끼 은도끼', text: `
옛날에 마음씨 착한 나무꾼이 살았어요.
어느 날 나무를 하다가 도끼를 연못에 빠뜨렸어요.
그러자 연못에서 산신령이 나타났어요.
"이 금도끼가 네 도끼냐?"
"아닙니다. 제 도끼는 낡은 쇠도끼입니다."
"그럼 이 은도끼가 네 도끼냐?"
"아닙니다. 그것도 제 도끼가 아닙니다."
산신령은 정직한 나무꾼에게 세 도끼를 모두 주었어요.
욕심쟁이 이웃은 일부러 도끼를 연못에 던졌어요.
"이 금도끼가 네 도끼냐?"
"네, 바로 그 금도끼가 제 것입니다!"
산신령은 화를 내며 쇠도끼까지 가지고 사라졌어요.` },
  ].map(st => ({ ...st, lines: st.text.trim().split('\n') }));

  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  let mode = 'jari';
  let lastSentence = '';
  function makeLine() {
    if (mode === 'jari') {
      const set = [...JARI[$('rowSelect').value]];
      return Array.from({ length: 10 }, () => pick(set)).join(' ');
    }
    if (mode === 'word') {
      return Array.from({ length: 4 }, () => pick(WORDS)).join(' ');
    }
    let s;
    do { s = pick(SENTENCES); } while (s === lastSentence);
    lastSentence = s;
    return s;
  }

  // ===== 상태 =====
  const $ = id => document.getElementById(id);
  let target = '', nextLine = '', targetKeys = [], typed = [];
  let lineStart = 0, lineDone = false;
  let goodKeys = 0, totalKeys = 0, lines = 0;
  let stickyShift = false;

  let storyPos = 0, finished = false;
  function newLine(fresh) {
    finished = false;
    $('target').classList.remove('finish');
    if (mode === 'story') {
      const st = STORIES[$('storySelect').value];
      storyPos = fresh ? 0 : storyPos + 1;
      if (storyPos >= st.lines.length) { showFinished(st); return; }
      target = st.lines[storyPos];
      nextLine = st.lines[storyPos + 1] || '(마지막 줄이에요)';
      $('progress').textContent = `📖 ${st.title} · ${storyPos + 1} / ${st.lines.length}줄`;
    } else {
      target = fresh || !nextLine ? makeLine() : nextLine;
      nextLine = makeLine();
      $('progress').textContent = '';
    }
    targetKeys = toKeys(target);
    typed = [];
    lineStart = 0;
    lineDone = false;
    render();
  }
  function showFinished(st) {
    finished = true;
    lineDone = true;
    $('target').textContent = `🎉 「${st.title}」 끝까지 다 썼어요!`;
    $('target').classList.add('finish');
    $('typed').textContent = '';
    $('nextText').textContent = 'Enter를 누르면 처음부터 다시 써요';
    $('progress').textContent = `📖 ${st.title} · 완료`;
    document.querySelectorAll('.key.guide').forEach(k => k.classList.remove('guide', 'err'));
    keyEl('Enter').classList.add('guide');
    playFanfare();
  }

  // 지금까지 친 키가 정답의 앞부분과 같은 길이
  function matchLen() {
    let i = 0;
    while (i < typed.length && typed[i] === targetKeys[i]) i++;
    return i;
  }

  function render() {
    const tChars = [...target];
    const out = compose(typed);
    const allRight = matchLen() === typed.length;

    // 위: 따라 칠 글 (지금 칠 글자 표시)
    const tBox = $('target');
    tBox.textContent = '';
    const curIdx = Math.max(0, allRight && typed.length && out[out.length - 1] !== tChars[out.length - 1] ? out.length - 1 : out.length);
    tChars.forEach((ch, i) => {
      const s = document.createElement('span');
      s.textContent = ch;
      if (i === curIdx && !lineDone) s.className = 'cur';
      tBox.append(s);
    });

    // 아래: 내가 친 글
    const box = $('typed');
    box.textContent = '';
    out.forEach((ch, i) => {
      const s = document.createElement('span');
      s.textContent = ch;
      const last = i === out.length - 1;
      if (ch === tChars[i]) s.className = 'ok';
      else if (last && allRight) s.className = 'now';  // 아직 조합 중인 글자
      else s.className = 'bad';
      box.append(s);
    });
    if (!lineDone) {
      const caret = document.createElement('span');
      caret.className = 'caret';
      box.append(caret);
    }
    $('nextText').textContent = '다음: ' + nextLine;

    // 다음에 누를 키 깜빡이기
    document.querySelectorAll('.key.guide').forEach(k => k.classList.remove('guide', 'err'));
    if (lineDone) return;
    if (!allRight) {
      keyEl('Backspace').classList.add('guide', 'err');
      return;
    }
    const info = KEY_OF[targetKeys[typed.length]];
    if (info) {
      keyEl(info.code).classList.add('guide');
      if (info.shift) {
        // 오른손 키면 왼쪽 Shift, 왼손 키면 오른쪽 Shift
        const left = FINGER_SIDE[info.code] === 'L';
        keyEl(left ? 'ShiftRight' : 'ShiftLeft').classList.add('guide');
      }
    }
  }

  function updateStats() {
    $('accuracy').textContent = totalKeys ? Math.round(goodKeys / totalKeys * 100) : 100;
    $('lineCount').textContent = lines;
    const min = (Date.now() - lineStart) / 60000;
    $('speed').textContent = lineStart && min > 0 ? Math.round(matchLen() / min) : 0;
  }

  function press(code, shift) {
    if (finished) { if (code === 'Enter') newLine(true); return; }
    if (lineDone) return;
    if (code === 'Backspace') {
      typed.pop();
    } else if (code === 'Enter') {
      return;
    } else {
      const ch = TYPEABLE[code];
      if (!ch) return;
      if (typed.length >= targetKeys.length + 5) return;  // 너무 많이 치지 않게
      if (!lineStart) lineStart = Date.now();
      typed.push(shift ? ch[1] : ch[0]);
      totalKeys++;
      if (typed[typed.length - 1] === targetKeys[typed.length - 1] && matchLen() === typed.length) goodKeys++;
    }
    if (typed.length === targetKeys.length && matchLen() === typed.length) {
      lineDone = true;
      lines++;
      playDingDong();
      updateStats();
      render();
      setTimeout(() => newLine(false), 700);
      return;
    }
    updateStats();
    render();
  }

  // ===== 키보드 그리기 =====
  const FINGER_SIDE = {};
  function keyEl(code) { return document.querySelector(`.key[data-code="${code}"]`); }
  function drawKeyboard() {
    const kb = $('keyboard');
    ROWS.forEach(row => {
      const r = document.createElement('div');
      r.className = 'krow';
      // 키보드 가운데를 기준으로 왼손/오른손 구분
      const half = row.reduce((a, k) => a + k[4], 0) / 2;
      let x = 0;
      row.forEach(([code, normal, shift, en, width, finger]) => {
        FINGER_SIDE[code] = x + width / 2 < half ? 'L' : 'R';
        x += width;
        const k = document.createElement('div');
        k.className = 'key' + (finger ? ' f' + finger : ' fn') + (code === 'KeyF' || code === 'KeyJ' ? ' home' : '');
        k.dataset.code = code;
        k.style.flexGrow = width;
        k.textContent = normal;
        if (shift && finger && /[ㄱ-ㅣ]/.test(shift)) {
          const s = document.createElement('span');
          s.className = 'sh';
          s.textContent = shift;
          k.append(s);
        }
        if (en) {
          const e = document.createElement('span');
          e.className = 'en';
          e.textContent = en;
          k.append(e);
        }
        k.addEventListener('pointerdown', e => {
          e.preventDefault();
          getAudio();
          if (code === 'ShiftLeft' || code === 'ShiftRight') {
            stickyShift = !stickyShift;
            document.querySelectorAll('[data-code^="Shift"]').forEach(s => s.classList.toggle('sticky', stickyShift));
            return;
          }
          flash(code);
          press(code, stickyShift);
          if (stickyShift) {
            stickyShift = false;
            document.querySelectorAll('[data-code^="Shift"]').forEach(s => s.classList.remove('sticky'));
          }
        });
        r.append(k);
      });
      kb.append(r);
    });
  }
  function flash(code) {
    const k = keyEl(code);
    if (!k) return;
    k.classList.add('down');
    setTimeout(() => k.classList.remove('down'), 120);
  }

  // ===== 실제 키보드 =====
  // 한/영 상태와 상관없이 키 위치(e.code)로 한글을 만듦
  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.altKey || e.metaKey) return;
    const k = keyEl(e.code);
    if (!k) return;
    e.preventDefault();
    k.classList.add('down');
    if (!e.code.startsWith('Shift')) press(e.code, e.shiftKey);
  });
  document.addEventListener('keyup', e => {
    const k = keyEl(e.code);
    if (k) k.classList.remove('down');
  });
  window.addEventListener('blur', () =>
    document.querySelectorAll('.key.down').forEach(k => k.classList.remove('down')));

  // ===== 연습 종류 =====
  document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
    mode = b.dataset.mode;
    document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
    $('rowSelect').style.display = mode === 'jari' ? '' : 'none';
    $('storySelect').style.display = mode === 'story' ? '' : 'none';
    b.blur();
    newLine(true);
  }));
  $('rowSelect').addEventListener('change', () => { $('rowSelect').blur(); newLine(true); });
  // 긴 글 목록 (노래 / 이솝 우화 / 전래 동화로 묶음)
  STORIES.forEach((st, i) => {
    const sel = $('storySelect');
    let group = [...sel.children].find(g => g.label === st.group);
    if (!group) {
      group = document.createElement('optgroup');
      group.label = st.group;
      sel.append(group);
    }
    group.append(new Option(st.title, i));
  });
  $('storySelect').addEventListener('change', () => { $('storySelect').blur(); newLine(true); });

  // ===== 효과음 =====
  let audioCtx;
  function getAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function tone(freq, start, dur, type, vol) {
    const ctx = getAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    const t = ctx.currentTime + start;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(vol, t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t);
    osc.stop(t + dur);
  }
  function playFanfare() {
    [[523.25, 0], [659.25, 0.15], [783.99, 0.3], [1046.5, 0.45]].forEach(([f, s]) =>
      tone(f, s, s === 0.45 ? 0.9 : 0.2, 'triangle', 0.35));
  }
  function playDingDong() { tone(1046.5, 0, 0.4, 'sine', 0.4); tone(784, 0.2, 0.6, 'sine', 0.4); }
  ['keydown', 'pointerdown'].forEach(ev =>
    document.addEventListener(ev, getAudio, { once: true }));

  drawKeyboard();
  newLine(true);
</script>
<script src="fullscreen.js"></script>
