<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>뽀모도로 타이머</title>
<style>
  :root {
    --bg: #fdf8ee;
    --ink: #2b2b2b;
    --accent: #3b82f6;
    --ok: #16a34a;
    --bad: #dc2626;
    --warn: #f59e0b;
    --timer: #e11d48;
    --track: #e5e7eb;
    --box: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", "Malgun Gothic", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    user-select: none;
  }

  .top {
    width: 100%;
    max-width: 900px;
    padding: 20px 16px 0;
  }
  .home {
    display: inline-block;
    font-size: clamp(16px, 3vw, 22px);
    font-weight: 700;
    padding: 8px 16px;
    border-radius: 12px;
    background: #e5e7eb;
    color: var(--ink);
    text-decoration: none;
    white-space: nowrap;
  }
  .home:active { transform: scale(.97); }

  main {
    width: 100%;
    max-width: 900px;
    padding: 16px 16px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }
  h1 { font-size: clamp(28px, 6vw, 48px); margin: 0; }

  /* 시간 고르기 */
  .presets {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }
  .preset {
    font-size: clamp(18px, 3.6vw, 26px);
    font-weight: 700;
    font-family: inherit;
    padding: 10px 18px;
    border: 4px solid var(--timer);
    border-radius: 14px;
    background: var(--box);
    color: var(--timer);
    cursor: pointer;
  }
  .preset.on { background: var(--timer); color: #fff; }
  .preset:disabled { opacity: .45; cursor: default; }
  .preset:not(:disabled):active { transform: scale(.97); }

  /* 동그란 타이머 */
  .clock {
    position: relative;
    width: min(80vw, 420px);
    aspect-ratio: 1;
  }
  .clock svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .clock circle { fill: none; stroke-width: 18; }
  #track { stroke: var(--track); }
  #ring {
    stroke: var(--timer);
    stroke-linecap: round;
    transition: stroke-dashoffset .25s linear, stroke .3s;
  }
  .clock-text {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  #timeText {
    font-size: clamp(56px, 16vw, 110px);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  #stateText { font-size: clamp(18px, 3.6vw, 26px); color: #6b7280; font-weight: 700; }

  .controls { display: flex; gap: 14px; }
  .controls button {
    font-size: clamp(22px, 4vw, 32px);
    font-weight: 700;
    font-family: inherit;
    padding: 14px 36px;
    border: none;
    border-radius: 14px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 5px 0 rgba(0, 0, 0, 0.15);
  }
  .controls button:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0, 0, 0, 0.15); }
  #resetBtn { background: #6b7280; }
  #doneCount { font-size: clamp(18px, 3.6vw, 26px); font-weight: 700; }

  /* 끝! */
  #mark {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity .2s;
  }
  #mark.show { opacity: 1; }
  #markSymbol { font-size: clamp(120px, 30vw, 300px); line-height: 1; }
  #markMsg {
    font-size: clamp(32px, 8vw, 72px);
    font-weight: 800;
    color: var(--timer);
    background: rgba(255, 255, 255, 0.9);
    padding: 8px 32px;
    border-radius: 24px;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="top">
    <a class="home" href="index.html">🏠 처음으로</a>
  </div>

  <main>
    <h1>🍅 뽀모도로 타이머</h1>

    <div class="presets" id="presets"></div>

    <div class="clock">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <circle id="track" cx="100" cy="100" r="88"></circle>
        <circle id="ring" cx="100" cy="100" r="88"></circle>
      </svg>
      <div class="clock-text">
        <div id="timeText">00:00</div>
        <div id="stateText"></div>
      </div>
    </div>

    <div class="controls">
      <button id="startBtn">▶ 시작</button>
      <button id="resetBtn">↺ 처음부터</button>
    </div>
    <div id="doneCount"></div>
  </main>

  <div id="mark"><div id="markSymbol">🍅</div><div id="markMsg">짜잔! 시간 끝!</div></div>

<script>
  const PRESETS = [3, 5, 10, 15, 30, 45];  // 분
  const MINUTES_KEY = 'pomodoroMinutes';
  const RING_LEN = 2 * Math.PI * 88;

  const $ = id => document.getElementById(id);
  const ring = $('ring');
  ring.style.strokeDasharray = RING_LEN;

  let minutes = 5, total, left, endAt = null, timerId, lastTickSec = null, doneCount = 0, markId;

  // ===== 소리 =====
  let audioCtx;
  function getAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function tone(freq, start, dur, type, vol) {
    const ctx = getAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    const t = ctx.currentTime + start;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(vol, t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t);
    osc.stop(t + dur);
  }
  function playFanfare(delay) {       // 빠-빠-빠-빠밤!
    const notes = [
      [523.25, 0.00, 0.15], [523.25, 0.16, 0.15], [523.25, 0.32, 0.15],  // C5 C5 C5
      [659.25, 0.48, 0.30], [587.33, 0.80, 0.15], [659.25, 0.96, 0.15],  // E5 D5 E5
      [783.99, 1.12, 0.90],                                              // G5 ~
    ];
    notes.forEach(([f, s, d]) => {
      tone(f, delay + s, d + 0.1, 'triangle', 0.35);
      tone(f * 2, delay + s, d + 0.1, 'sawtooth', 0.06);  // 금관 느낌 배음
    });
    // 마지막 화음
    tone(523.25, delay + 1.12, 1.0, 'triangle', 0.2);
    tone(659.25, delay + 1.12, 1.0, 'triangle', 0.2);
  }
  function playTick(high) {           // 째깍(높은음) / 짹각(낮은음)
    tone(high ? 1800 : 1400, 0, 0.05, 'square', 0.15);
  }

  function store(key, value) { try { localStorage.setItem(key, value); } catch {} }
  function load(key) { try { return localStorage.getItem(key); } catch { return null; } }

  // ===== 화면 =====
  function fmt(ms) {
    const s = Math.ceil(ms / 1000);
    return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  }

  function render() {
    const running = endAt !== null;
    const ratio = left / total;
    $('timeText').textContent = fmt(left);
    ring.style.strokeDashoffset = RING_LEN * (1 - ratio);
    ring.style.stroke = ratio > 0.5 ? 'var(--timer)' : ratio > 0.2 ? 'var(--warn)' : 'var(--bad)';
    $('stateText').textContent = running ? '집중!' : left === total ? `${minutes}분` : '잠깐 멈춤';
    $('startBtn').textContent = running ? '⏸ 멈춤' : left === total ? '▶ 시작' : '▶ 계속';
    document.querySelectorAll('.preset').forEach(b => {
      b.classList.toggle('on', +b.dataset.min === minutes);
      b.disabled = running;
    });
    document.title = running ? `${fmt(left)} 🍅 뽀모도로` : '뽀모도로 타이머';
    $('doneCount').textContent = doneCount ? `🍅 × ${doneCount}` : '';
  }

  function setMinutes(m) {
    minutes = m;
    store(MINUTES_KEY, m);
    reset();
  }

  function reset() {
    clearInterval(timerId);
    endAt = null;
    total = left = minutes * 60 * 1000;
    render();
  }

  function start() {
    getAudio();
    endAt = Date.now() + left;
    lastTickSec = null;
    timerId = setInterval(tick, 250);
    render();
  }

  function pause() {
    clearInterval(timerId);
    left = Math.max(0, endAt - Date.now());
    endAt = null;
    render();
  }

  function tick() {
    left = Math.max(0, endAt - Date.now());
    // 마지막 10초는 째깍째깍
    const sec = Math.ceil(left / 1000);
    if (left > 0 && sec <= 10 && sec !== lastTickSec) {
      lastTickSec = sec;
      playTick(sec % 2 === 0);
    }
    if (left <= 0) { finish(); return; }
    render();
  }

  function finish() {
    clearInterval(timerId);
    endAt = null;
    left = 0;
    doneCount++;
    render();
    playFanfare(0);
    clearTimeout(markId);
    $('mark').classList.add('show');
    markId = setTimeout(() => {
      $('mark').classList.remove('show');
      reset();
    }, 4000);
  }

  // 시간 버튼 만들기
  PRESETS.forEach(m => {
    const b = document.createElement('button');
    b.className = 'preset';
    b.dataset.min = m;
    b.textContent = `${m}분`;
    b.addEventListener('click', () => setMinutes(m));
    $('presets').append(b);
  });

  $('startBtn').addEventListener('click', () => {
    if (endAt !== null) pause();
    else {
      clearTimeout(markId);
      $('mark').classList.remove('show');
      if (left <= 0) reset();
      start();
    }
  });
  $('resetBtn').addEventListener('click', () => {
    clearTimeout(markId);
    $('mark').classList.remove('show');
    reset();
  });
  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); $('startBtn').click(); }
  });

  const saved = parseInt(load(MINUTES_KEY), 10);
  if (PRESETS.includes(saved)) minutes = saved;
  reset();
</script>
</body>
</html>
