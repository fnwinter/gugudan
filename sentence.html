<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문장 암기</title>
<style>
  :root {
    --bg: #fdf8ee;
    --ink: #2b2b2b;
    --accent: #3b82f6;
    --ok: #16a34a;
    --bad: #dc2626;
    --warn: #f59e0b;
    --box: #ffffff;
    --muted: #6b7280;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", "Malgun Gothic", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  button {
    font-size: clamp(18px, 3.5vw, 26px);
    font-weight: 700;
    padding: 10px 24px;
    border: none;
    border-radius: 14px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    font-family: inherit;
  }
  button:active { transform: scale(.97); }
  button.sub { background: var(--muted); }
  button.ghost { background: transparent; color: var(--muted); padding: 6px 10px; }
  button:disabled { opacity: .4; cursor: default; }

  /* 상단 */
  .top {
    width: 100%;
    max-width: 900px;
    padding: 16px 16px 0;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
  }
  .tabs {
    display: flex;
    background: #e5e7eb;
    border-radius: 14px;
    padding: 4px;
    margin-left: auto;
  }
  .tabs button { background: transparent; color: var(--ink); padding: 8px 20px; }
  .tabs button.on { background: var(--box); color: var(--accent); box-shadow: 0 2px 4px rgba(0,0,0,.1); }
  #addBtn { background: var(--ok); }

  main {
    flex: 1;
    width: 100%;
    max-width: 900px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
  }
  .view { display: none; width: 100%; flex-direction: column; align-items: center; gap: 24px; }
  .view.on { display: flex; }

  .count { font-size: clamp(20px, 4vw, 28px); font-weight: 700; font-variant-numeric: tabular-nums; }
  .empty { font-size: clamp(22px, 4vw, 30px); color: var(--muted); text-align: center; line-height: 1.6; }

  /* 외우기 모드 */
  .stage {
    width: 100%;
    min-height: 40vh;
    background: var(--box);
    border-radius: 24px;
    box-shadow: 0 6px 0 rgba(0,0,0,.08);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .slide { text-align: center; }
  .slide.roll { animation: roll .6s ease-out; }
  @keyframes roll {
    from { transform: translateY(70%); opacity: 0; }
    to   { transform: translateY(0);   opacity: 1; }
  }
  .sentence {
    font-size: clamp(30px, 6.5vw, 64px);
    font-weight: 800;
    line-height: 1.3;
    word-break: keep-all;
    overflow-wrap: anywhere;
  }
  .meaning {
    margin-top: 16px;
    font-size: clamp(20px, 4vw, 32px);
    color: var(--muted);
    word-break: keep-all;
  }
  .bar { width: 100%; height: 14px; background: #e5e7eb; border-radius: 7px; overflow: hidden; }
  #barFill { height: 100%; width: 0; background: var(--accent); }
  .controls { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 12px; }
  .speed {
    display: flex; align-items: center; gap: 8px;
    font-size: clamp(18px, 3.5vw, 24px); font-weight: 700;
  }
  .speed input {
    width: 90px;
    font-size: inherit; font-weight: inherit; font-family: inherit;
    text-align: center;
    padding: 6px;
    border: 3px solid #9ca3af;
    border-radius: 10px;
  }
  .speed input:focus { outline: none; border-color: var(--accent); }

  /* 맞추기 모드 */
  .prompt {
    font-size: clamp(28px, 6vw, 56px);
    font-weight: 800;
    text-align: center;
    line-height: 1.3;
    word-break: keep-all;
  }
  .initials {
    font-size: clamp(20px, 4vw, 30px);
    color: var(--muted);
    text-align: center;
    letter-spacing: .05em;
  }
  #answer {
    width: 100%;
    font-size: clamp(22px, 4.5vw, 40px);
    font-weight: 700;
    font-family: inherit;
    color: var(--accent);
    background: var(--box);
    border: 5px solid #9ca3af;
    border-radius: 18px;
    outline: none;
    padding: 12px 16px;
    resize: none;
  }
  #answer:focus { border-color: var(--accent); box-shadow: 0 0 0 6px rgba(59,130,246,.2); }
  #answer:disabled { color: var(--ink); background: #f3f4f6; }
  .result { display: none; flex-direction: column; align-items: center; gap: 8px; }
  .result.show { display: flex; }
  #resultMark { font-size: clamp(90px, 20vw, 160px); font-weight: 900; line-height: 1; }
  #resultMark.ok { color: var(--ok); }
  #resultMark.bad { color: var(--bad); }
  #resultAnswer { font-size: clamp(20px, 4vw, 30px); font-weight: 700; text-align: center; }
  .hint { font-size: clamp(15px, 3vw, 20px); color: var(--muted); text-align: center; }

  .summary { width: 100%; display: flex; flex-direction: column; gap: 8px; }
  .summary div {
    display: flex; gap: 12px; align-items: baseline;
    background: var(--box); border-radius: 12px; padding: 10px 14px;
    font-size: clamp(18px, 3.5vw, 24px);
  }
  .summary b { font-size: 1.3em; }
  .summary .o { color: var(--ok); }
  .summary .x { color: var(--bad); }

  /* 문장 관리 창 */
  #editor {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  #editor.show { display: flex; }
  .panel {
    background: var(--box);
    border-radius: 18px;
    padding: 20px;
    width: min(100%, 1100px);
    height: min(100%, 900px);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .panel h2 { margin: 0; font-size: clamp(22px, 4vw, 30px); }
  #bulkText {
    flex: 1;
    width: 100%;
    min-height: 200px;
    font-size: clamp(18px, 2.5vw, 22px);
    line-height: 1.6;
    font-family: inherit;
    padding: 14px 16px;
    border: 3px solid #9ca3af;
    border-radius: 12px;
    resize: none;
  }
  #bulkText:focus { outline: none; border-color: var(--accent); }
  #editorMsg { font-weight: 700; margin-right: auto; }
  #editorMsg.ok { color: var(--ok); }
  .panel-btns { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: flex-end; }
  .home {
    display: inline-block;
    font-size: clamp(16px, 3vw, 22px);
    font-weight: 700;
    padding: 8px 16px;
    border-radius: 12px;
    background: #e5e7eb;
    color: var(--ink);
    text-decoration: none;
    white-space: nowrap;
  }
  .home:active { transform: scale(.97); }
</style>
</head>
<body>
  <div class="top">
    <a class="home" href="index.html">🏠 처음으로</a>
    <div class="tabs">
      <button id="tabStudy" class="on">📖 외우기</button>
      <button id="tabTest">✏️ 맞추기</button>
    </div>
    <button id="addBtn">✏️ 문장 입력</button>
  </div>

  <main>
    <div class="empty" id="empty">아직 문장이 없어요.<br><b>✏️ 문장 입력</b> 버튼을 눌러 외울 글을 넣어 주세요.</div>

    <!-- 외우기 모드 -->
    <section class="view on" id="studyView">
      <div class="count"><span id="studyNo">1</span> / <span id="studyTotal">1</span></div>
      <div class="stage">
        <div class="slide" id="slide">
          <div class="sentence" id="studyText"></div>
          <div class="meaning" id="studyMeaning"></div>
        </div>
      </div>
      <div class="bar"><div id="barFill"></div></div>
      <div class="controls">
        <button id="prevBtn" class="sub">◀ 이전</button>
        <button id="playBtn">⏸ 멈춤</button>
        <button id="nextBtn" class="sub">다음 ▶</button>
      </div>
      <div class="controls">
        <label class="speed">⏱ 넘어가는 시간
          <input id="interval" type="number" min="1" max="60" step="0.5" value="5">초
        </label>
        <button id="testThisBtn" class="sub">✏️ 이 문장 테스트</button>
      </div>
    </section>

    <!-- 맞추기 모드 -->
    <section class="view" id="testView">
      <div class="count">
        <span id="testNo">1</span> / <span id="testTotal">1</span>
        &nbsp; ⭕ <span id="okCount">0</span> &nbsp; ❌ <span id="badCount">0</span>
      </div>
      <div id="testQuestion" style="display:contents">
        <div class="prompt" id="prompt"></div>
        <div class="initials" id="initials"></div>
        <textarea id="answer" rows="2" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
        <div class="result" id="result">
          <div id="resultMark"></div>
          <div id="resultAnswer"></div>
        </div>
        <div class="controls">
          <button id="hintBtn" class="sub">💡 힌트</button>
          <button id="checkBtn">확인</button>
          <button id="skipBtn" class="sub">다음 ▶</button>
        </div>
        <div class="hint">문장을 입력하고 Enter! (대소문자·마침표는 신경 쓰지 않아요)</div>
      </div>
      <div id="testDone" style="display:none; width:100%; flex-direction:column; align-items:center; gap:20px">
        <div class="prompt" id="doneTitle"></div>
        <div class="summary" id="summary"></div>
        <div class="controls">
          <button id="retryWrongBtn" class="sub">틀린 것만 다시</button>
          <button id="restartBtn">처음부터 다시</button>
        </div>
      </div>
    </section>
  </main>

  <!-- 문장 입력 -->
  <div id="editor">
    <div class="panel">
      <h2>문장 입력</h2>
      <div class="hint" style="text-align:left">
        외울 글을 통째로 붙여 넣으세요. 줄마다, 그리고 <b>. ! ?</b> 뒤에서 한 문장씩 나눠져요.<br>
        뜻을 붙이고 싶으면 한 줄에 <b>문장 | 뜻</b> 처럼 적어요.
      </div>
      <textarea id="bulkText" spellcheck="false" placeholder="I am happy to see you. How are you today?&#10;It is a beautiful day.&#10;Thank you very much. | 정말 고마워요."></textarea>
      <div class="panel-btns">
        <span id="editorMsg"></span>
        <button id="closeBtn" class="sub">취소</button>
        <button id="saveBtn">저장</button>
      </div>
    </div>
  </div>

<script>
  const STORAGE_KEY = 'sentences';
  const INTERVAL_KEY = 'sentence-interval';
  const TICK = 100;  // ms

  const $ = id => document.getElementById(id);
  let sentences = [];
  let mode = 'study';

  // 저장소
  function load() {
    try { sentences = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { sentences = []; }
    try {
      const v = parseFloat(localStorage.getItem(INTERVAL_KEY));
      if (v >= 1 && v <= 60) $('interval').value = v;
    } catch {}
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(sentences)); } catch {}
  }

  // 효과음 (Web Audio API로 직접 생성)
  let audioCtx;
  function getAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function tone(freq, start, dur, type, vol) {
    const ctx = getAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    const t = ctx.currentTime + start;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(vol, t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t);
    osc.stop(t + dur);
  }
  function playDingDong() { tone(1046.5, 0, 0.6, 'sine', 0.5); tone(784, 0.35, 0.9, 'sine', 0.5); }
  function playBeep() { tone(220, 0, 0.5, 'square', 0.25); }

  // 화면 전환
  function render() {
    const has = sentences.length > 0;
    $('empty').style.display = has ? 'none' : '';
    $('studyView').classList.toggle('on', has && mode === 'study');
    $('testView').classList.toggle('on', has && mode === 'test');
    $('tabStudy').classList.toggle('on', mode === 'study');
    $('tabTest').classList.toggle('on', mode === 'test');
  }
  function setMode(m, testOrder) {
    mode = m;
    render();
    if (!sentences.length) { stopStudy(); return; }
    if (m === 'study') { startStudy(); }
    else { stopStudy(); startTest(testOrder || sentences.map((_, i) => i)); }
  }
  $('tabStudy').addEventListener('click', () => setMode('study'));
  $('tabTest').addEventListener('click', () => setMode('test'));

  // ===== 외우기 모드 =====
  let studyIdx = 0, elapsed = 0, playing = true, studyTimer = null;

  function intervalMs() {
    const v = parseFloat($('interval').value);
    return (v >= 1 ? Math.min(v, 60) : 5) * 1000;
  }
  function showStudy(roll) {
    if (!sentences.length) return;
    studyIdx = (studyIdx + sentences.length) % sentences.length;
    const s = sentences[studyIdx];
    $('studyText').textContent = s.text;
    $('studyMeaning').textContent = s.meaning || '';
    $('studyNo').textContent = studyIdx + 1;
    $('studyTotal').textContent = sentences.length;
    elapsed = 0;
    $('barFill').style.width = '0%';
    if (roll) {
      const slide = $('slide');
      slide.classList.remove('roll');
      void slide.offsetWidth;  // 애니메이션 다시 시작
      slide.classList.add('roll');
    }
  }
  function startStudy() {
    showStudy(true);
    clearInterval(studyTimer);
    studyTimer = setInterval(() => {
      if (!playing) return;
      elapsed += TICK;
      const total = intervalMs();
      $('barFill').style.width = Math.min(100, elapsed / total * 100) + '%';
      if (elapsed >= total) { studyIdx++; showStudy(true); }
    }, TICK);
  }
  function stopStudy() { clearInterval(studyTimer); studyTimer = null; }
  function setPlaying(p) {
    playing = p;
    $('playBtn').textContent = p ? '⏸ 멈춤' : '▶ 재생';
  }
  $('playBtn').addEventListener('click', () => setPlaying(!playing));
  $('prevBtn').addEventListener('click', () => { studyIdx--; showStudy(true); });
  $('nextBtn').addEventListener('click', () => { studyIdx++; showStudy(true); });
  $('interval').addEventListener('change', () => {
    const v = Math.min(60, Math.max(1, parseFloat($('interval').value) || 5));
    $('interval').value = v;
    try { localStorage.setItem(INTERVAL_KEY, v); } catch {}
  });

  // ===== 맞추기 모드 =====
  let order = [], pos = 0, results = [], answered = false;
  const answerBox = $('answer');

  // 대소문자, 띄어쓰기, 문장부호는 구분하지 않음
  function norm(s) {
    return s.toLowerCase()
      .replace(/[‘’`]/g, "'")
      .replace(/[.,!?;:"“”()\-]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }
  // 각 단어 첫 글자만 남긴 힌트: "I am happy." → "I a h."
  function initialsOf(text) {
    return text.split(/\s+/).map(w => w.replace(/([A-Za-z0-9가-힣])[A-Za-z0-9가-힣']*/, '$1')).join(' ');
  }

  function startTest(idxList) {
    order = idxList;
    pos = 0;
    results = [];
    $('testQuestion').style.display = 'contents';
    $('testDone').style.display = 'none';
    showQuestion();
  }
  function showQuestion() {
    const s = sentences[order[pos]];
    answered = false;
    $('testNo').textContent = pos + 1;
    $('testTotal').textContent = order.length;
    $('okCount').textContent = results.filter(r => r.ok).length;
    $('badCount').textContent = results.filter(r => !r.ok).length;
    // 뜻이 있으면 뜻을 보여주고, 없으면 첫 글자 힌트를 바로 보여줌
    $('prompt').textContent = s.meaning || '첫 글자를 보고 문장을 써 보세요';
    $('initials').textContent = s.meaning ? '' : initialsOf(s.text);
    $('hintBtn').style.display = s.meaning ? '' : 'none';
    $('result').classList.remove('show');
    $('checkBtn').style.display = '';
    $('skipBtn').textContent = '모르겠어요';
    answerBox.value = '';
    answerBox.disabled = false;
    answerBox.focus();
  }
  function check(giveUp) {
    if (answered) { next(); return; }
    const s = sentences[order[pos]];
    const typed = answerBox.value.trim();
    if (!giveUp && typed === '') { answerBox.focus(); return; }
    const ok = !giveUp && norm(typed) === norm(s.text);
    answered = true;
    results.push({ idx: order[pos], ok });
    if (ok) playDingDong(); else playBeep();

    answerBox.disabled = true;
    $('resultMark').textContent = ok ? 'O' : 'X';
    $('resultMark').className = ok ? 'ok' : 'bad';
    $('resultAnswer').textContent = ok ? '' : '정답: ' + s.text;
    $('result').classList.add('show');
    $('checkBtn').style.display = 'none';
    $('skipBtn').textContent = pos + 1 < order.length ? '다음 ▶' : '결과 보기';
    $('okCount').textContent = results.filter(r => r.ok).length;
    $('badCount').textContent = results.filter(r => !r.ok).length;
    $('skipBtn').focus();
  }
  function next() {
    pos++;
    if (pos < order.length) showQuestion();
    else showDone();
  }
  function showDone() {
    $('testQuestion').style.display = 'none';
    $('testDone').style.display = 'flex';
    const okN = results.filter(r => r.ok).length;
    $('doneTitle').textContent = `${results.length}문장 중 ${okN}개 맞았어요!` + (okN === results.length ? ' 🎉' : '');
    const box = $('summary');
    box.textContent = '';
    results.forEach(r => {
      const s = sentences[r.idx];
      const row = document.createElement('div');
      const mark = document.createElement('b');
      mark.className = r.ok ? 'o' : 'x';
      mark.textContent = r.ok ? 'O' : 'X';
      const txt = document.createElement('span');
      txt.textContent = s.text;
      row.append(mark, txt);
      box.append(row);
    });
    $('retryWrongBtn').style.display = okN < results.length ? '' : 'none';
  }

  $('checkBtn').addEventListener('click', () => check(false));
  $('skipBtn').addEventListener('click', () => answered ? next() : check(true));
  $('hintBtn').addEventListener('click', () => {
    $('initials').textContent = initialsOf(sentences[order[pos]].text);
    answerBox.focus();
  });
  $('restartBtn').addEventListener('click', () => startTest(sentences.map((_, i) => i)));
  $('retryWrongBtn').addEventListener('click', () => startTest(results.filter(r => !r.ok).map(r => r.idx)));
  answerBox.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); check(false); }
  });
  // 결과가 나온 뒤에는 Enter로 다음 문장
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && mode === 'test' && answered && document.activeElement !== $('skipBtn')
        && !$('editor').classList.contains('show')) {
      e.preventDefault();
      next();
    }
  });

  // ===== 문장 입력 =====
  // 글 전체를 문장 단위로 나눔.
  // - 줄마다 나누고, 한 줄에 여러 문장이 있으면 . ! ? 뒤에서 다시 나눔
  // - "문장 | 뜻" 처럼 | 가 있는 줄은 나누지 않고 한 문장 + 뜻으로 봄
  function parseText(text) {
    const list = [];
    const clean = t => t.trim().replace(/\s+/g, ' ');
    text.split('\n').forEach(line => {
      line = line.trim();
      if (!line) return;
      const bar = line.indexOf('|');
      if (bar >= 0) {
        const t = clean(line.slice(0, bar));
        if (t) list.push({ text: t, meaning: line.slice(bar + 1).trim() });
        return;
      }
      line.split(/(?<=[.!?。])\s+/).forEach(t => {
        t = clean(t);
        if (t) list.push({ text: t, meaning: '' });
      });
    });
    return list;
  }
  function sentencesToText(list) {
    return list.map(s => s.meaning ? `${s.text} | ${s.meaning}` : s.text).join('\n');
  }
  function updatePreview() {
    const n = parseText($('bulkText').value).length;
    $('editorMsg').className = n ? 'ok' : '';
    $('editorMsg').textContent = n ? `✔ ${n}개 문장으로 나눠져요` : '';
  }
  function openEditor() {
    setPlaying(false);
    $('bulkText').value = sentencesToText(sentences);
    updatePreview();
    $('editor').classList.add('show');
    $('bulkText').focus();
  }
  function closeEditor() {
    $('editor').classList.remove('show');
    setPlaying(true);
  }
  $('addBtn').addEventListener('click', openEditor);
  $('closeBtn').addEventListener('click', closeEditor);
  $('bulkText').addEventListener('input', updatePreview);
  $('saveBtn').addEventListener('click', () => {
    sentences = parseText($('bulkText').value);
    save();
    studyIdx = 0;
    closeEditor();
    setMode(mode);  // 바뀐 문장으로 처음부터 다시 시작
  });
  // 외우기 중 지금 보이는 문장만 바로 테스트
  $('testThisBtn').addEventListener('click', () => setMode('test', [studyIdx]));

  ['keydown', 'pointerdown'].forEach(ev =>
    document.addEventListener(ev, getAudio, { once: true }));

  load();
  setMode('study');
</script>
</body>
</html>
