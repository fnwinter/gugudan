<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한자 연습</title>
<style>
  :root {
    --bg: #fdf8ee;
    --ink: #2b2b2b;
    --accent: #3b82f6;
    --ok: #16a34a;
    --bad: #dc2626;
    --hanja: #b91c1c;
    --box: #ffffff;
    --muted: #6b7280;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", "Malgun Gothic", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* 상단 */
  .top {
    width: 100%;
    max-width: 900px;
    padding: 20px 16px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    font-size: clamp(20px, 4vw, 32px);
    font-weight: 700;
  }

  /* 가운데 문제 */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    width: 100%;
    padding: 16px;
  }
  .hanja {
    font-size: clamp(140px, 35vw, 280px);
    font-weight: 400;
    line-height: 1;
    color: var(--hanja);
    font-family: "Batang", "바탕", "Noto Serif KR", "Malgun Gothic", serif;
  }
  .reading {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: clamp(40px, 9vw, 80px);
    font-weight: 800;
    visibility: hidden;
  }
  .reading.show { visibility: visible; }
  .bracket { color: var(--muted); font-weight: 400; }
  #sound {
    width: 2.6em;
    font-size: inherit;
    font-weight: 800;
    font-family: inherit;
    text-align: center;
    color: var(--accent);
    background: var(--box);
    border: none;
    border-bottom: 6px solid #9ca3af;
    outline: none;
    padding: 0;
  }
  #sound:focus { border-bottom-color: var(--accent); }
  #sound:disabled { color: var(--ink); }

  .hint { font-size: clamp(16px, 3vw, 22px); color: var(--muted); text-align: center; }
  button {
    font-size: clamp(22px, 4vw, 32px);
    font-weight: 700;
    padding: 14px 40px;
    border: none;
    border-radius: 14px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    font-family: inherit;
  }
  button:active { transform: scale(.97); }
  button.sub { background: var(--muted); }
  #editBtn { font-size: clamp(16px, 3vw, 22px); padding: 8px 20px; }

  /* O / X 표시 */
  #mark {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity .15s;
  }
  #mark.show { opacity: 1; }
  #markSymbol {
    font-size: clamp(220px, 50vw, 520px);
    font-weight: 900;
    line-height: 1;
    text-shadow: 0 6px 24px rgba(0,0,0,.15);
  }
  #markSymbol.ok { color: var(--ok); }
  #markSymbol.bad { color: var(--bad); }
  #markMsg {
    font-size: clamp(24px, 5vw, 44px);
    font-weight: 700;
    background: rgba(255,255,255,.9);
    padding: 8px 24px;
    border-radius: 12px;
    text-align: center;
  }
  #markMsg:empty { display: none; }

  /* 문제 입력 창 */
  #editor {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  #editor.show { display: flex; }
  .panel {
    background: var(--box);
    border-radius: 18px;
    padding: 24px;
    width: min(100%, 700px);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .panel h2 { margin: 0; font-size: clamp(22px, 4vw, 30px); }
  #hanjaList {
    width: 100%;
    height: 50vh;
    font-size: 20px;
    font-family: inherit;
    padding: 12px;
    border: 3px solid #9ca3af;
    border-radius: 12px;
    resize: vertical;
  }
  #hanjaList:focus { outline: none; border-color: var(--accent); }
  #editorError { color: var(--bad); font-weight: 700; min-height: 1.2em; }
  .panel-btns { display: flex; flex-wrap: wrap; gap: 12px; justify-content: flex-end; }
  .panel-btns button { padding: 10px 24px; }
  #resetBtn { margin-right: auto; }
  .home {
    display: inline-block;
    font-size: clamp(16px, 3vw, 22px);
    font-weight: 700;
    padding: 8px 16px;
    border-radius: 12px;
    background: #e5e7eb;
    color: var(--ink);
    text-decoration: none;
    white-space: nowrap;
  }
  .home:active { transform: scale(.97); }
  .level {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: clamp(16px, 3vw, 22px);
  }
  #levelSelect {
    font-size: inherit;
    font-weight: 700;
    font-family: inherit;
    padding: 8px 12px;
    border: none;
    border-radius: 12px;
    background: #e5e7eb;
    color: var(--ink);
    cursor: pointer;
  }
  .level label { display: flex; align-items: center; gap: 4px; cursor: pointer; white-space: nowrap; }
  .level input[type=checkbox] { width: 1.1em; height: 1.1em; }
  .level label.off { opacity: .4; cursor: default; }
</style>
</head>
<body>
  <div class="top">
    <a class="home" href="index.html">🏠 처음으로</a>
    <div class="level">
      <select id="levelSelect" aria-label="급수 선택">
        <option value="8">8급</option>
        <option value="7">7급</option>
        <option value="6">6급</option>
        <option value="5">5급</option>
        <option value="4">4급</option>
        <option value="custom">내 문제</option>
      </select>
      <label id="cumulativeLabel"><input type="checkbox" id="cumulative"> 아래 급 포함</label>
    </div>
    <span>📝 <span id="totalCount">0</span>문제 &nbsp; ⭕ <span id="okCount">0</span> &nbsp; ❌ <span id="badCount">0</span></span>
    <button id="editBtn" class="sub">문제</button>
  </div>

  <main>
    <div class="hanja" id="hanja"></div>
    <div class="reading" id="reading">
      <span id="meaning"></span>
      <span><span class="bracket">[</span><input id="sound" autocomplete="off" spellcheck="false"><span class="bracket">]</span></span>
    </div>
    <button id="actionBtn">뜻 보기</button>
    <div class="hint" id="hint">Enter를 누르면 뜻이 나와요</div>
  </main>

  <div id="mark"><div id="markSymbol"></div><div id="markMsg"></div></div>

  <div id="editor">
    <div class="panel">
      <h2>문제 입력</h2>
      <div class="hint" style="text-align:left">
        한 줄에 하나씩 <b>한자,뜻,음</b> 형식으로 적어 주세요.<br>
        음이 여러 개면 <b>/</b>로 나눠요. (예: 六,여섯,륙/육)
      </div>
      <textarea id="hanjaList" spellcheck="false" placeholder="一,한,일&#10;山,메,산&#10;六,여섯,륙/육"></textarea>
      <div id="editorError"></div>
      <div class="panel-btns">
        <button id="resetBtn" class="sub">기본 한자로</button>
        <button id="cancelBtn" class="sub">취소</button>
        <button id="saveBtn">저장</button>
      </div>
    </div>
  </div>

    osc.connect(gain).connect(ctx.destination);
    osc.start(t);
    osc.stop(t + dur);
  }
  function playDingDong() { tone(1046.5, 0, 0.6, 'sine', 0.5); tone(784, 0.35, 0.9, 'sine', 0.5); }
  function playBeep() { tone(220, 0, 0.5, 'square', 0.25); }

  // "한자,뜻,음" 줄들을 문제 목록으로 변환
  function parseWords(text) {
    const list = [], bad = [];
    text.split('\n').forEach((line, i) => {
      line = line.trim();
      if (!line) return;
      const [hanja, meaning, sound] = line.split(',').map(s => (s || '').trim());
      if (hanja && meaning && sound) list.push({ hanja, meaning, sound });
      else bad.push(i + 1);
    });
    return { list, bad };
  }
  function wordsToText(list) { return list.map(w => `${w.hanja},${w.meaning},${w.sound}`).join('\n'); }

  function store(key, value) { try { localStorage.setItem(key, value); } catch {} }
  function load(key) { try { return localStorage.getItem(key); } catch { return null; } }

  function loadSettings() {
    try { customWords = JSON.parse(load(STORAGE_KEY)) || []; } catch { customWords = []; }
    // 예전에 저장한 내 문제가 있으면 그걸로 시작
    let level = load(LEVEL_KEY) || (customWords.length ? 'custom' : '8');
    if (level === 'custom' && !customWords.length) level = '8';
    $('levelSelect').value = level;
    $('cumulative').checked = load(CUMULATIVE_KEY) === '1';
  }

  // 선택한 급수에 맞게 문제 목록 만들기
  function applyLevel() {
    const level = $('levelSelect').value;
    const custom = level === 'custom';
    $('cumulative').disabled = custom;
    $('cumulativeLabel').classList.toggle('off', custom);
    if (custom) {
      words = customWords;
    } else {
      const upTo = LEVELS.indexOf(level);
      const picked = $('cumulative').checked ? LEVELS.slice(0, upTo + 1) : [level];
      words = picked.flatMap(l => parseWords(LEVEL_TEXT[l]).list);
    }
  }

  function restart() {
    clearTimeout(nextId);
    $('mark').classList.remove('show');
    current = null;
    newProblem();
  }

  function newProblem() {
    let w;
    do { w = words[Math.floor(Math.random() * words.length)]; }
    while (words.length > 1 && w === current);  // 같은 문제 연속 방지
    current = w;
    step = 'hanja';
    $('hanja').textContent = w.hanja;
    $('meaning').textContent = w.meaning;
    $('reading').classList.remove('show');
    soundBox.value = '';
    soundBox.disabled = true;
    $('actionBtn').textContent = '뜻 보기';
    $('hint').textContent = 'Enter를 누르면 뜻이 나와요';
    $('actionBtn').focus();
  }

  function showMeaning() {
    step = 'sound';
    $('reading').classList.add('show');
    soundBox.disabled = false;
    soundBox.focus();
    $('actionBtn').textContent = '확인';
    $('hint').textContent = '[ ] 안에 음을 쓰고 Enter!';
  }

  function check() {
    if (step !== 'sound') return;
    const typed = soundBox.value.replace(/[\s\[\]]/g, '');
    if (typed === '') { soundBox.focus(); return; }
    const answers = current.sound.split('/').map(s => s.trim());
    finish(answers.includes(typed));
  }

  function finish(correct) {
    step = 'done';
    soundBox.disabled = true;
    if (correct) { okCount++; playDingDong(); } else { badCount++; playBeep(); }
    $('okCount').textContent = okCount;
    $('badCount').textContent = badCount;
    $('totalCount').textContent = okCount + badCount;

    const sym = $('markSymbol');
    sym.textContent = correct ? 'O' : 'X';
    sym.className = correct ? 'ok' : 'bad';
    $('markMsg').textContent = correct ? '' : `정답: ${current.hanja} ${current.meaning} [${current.sound}]`;
    $('mark').classList.add('show');

    nextId = setTimeout(() => {
      $('mark').classList.remove('show');
      newProblem();
    }, correct ? NEXT_DELAY : WRONG_DELAY);
  }

  function action() {
    if (step === 'hanja') showMeaning();
    else if (step === 'sound') check();
  }

  // 한글 입력 중 Enter를 누르면 글자 조합이 끝난 뒤에 채점
  let submitAfterCompose = false;
  soundBox.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    e.stopPropagation();
    if (e.isComposing) submitAfterCompose = true;
    else check();
  });
  soundBox.addEventListener('compositionend', () => {
    if (submitAfterCompose) { submitAfterCompose = false; setTimeout(check, 0); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && step === 'hanja' && !$('editor').classList.contains('show')) {
      e.preventDefault();
      showMeaning();
    }
  });
  $('actionBtn').addEventListener('click', action);

  // 문제 입력 창
  function openEditor() {
    clearTimeout(nextId);
    $('mark').classList.remove('show');
    step = 'editing';
    $('hanjaList').value = wordsToText(words);
    $('editorError').textContent = '';
    $('editor').classList.add('show');
    $('hanjaList').focus();
  }
  function closeEditor() {
    $('editor').classList.remove('show');
    // 내 문제가 비어 있으면 원래 고른 급수로 되돌림
    if ($('levelSelect').value === 'custom' && !customWords.length) {
      const prev = load(LEVEL_KEY);
      $('levelSelect').value = prev && prev !== 'custom' ? prev : '8';
    }
    applyLevel();
    restart();
  }
  $('levelSelect').addEventListener('change', () => {
    const level = $('levelSelect').value;
    if (level === 'custom' && !customWords.length) { openEditor(); return; }  // 내 문제가 없으면 바로 입력 창
    store(LEVEL_KEY, level);
    applyLevel();
    restart();
  });
  $('cumulative').addEventListener('change', () => {
    store(CUMULATIVE_KEY, $('cumulative').checked ? '1' : '0');
    applyLevel();
    restart();
  });
  $('editBtn').addEventListener('click', openEditor);
  $('cancelBtn').addEventListener('click', closeEditor);
  $('resetBtn').addEventListener('click', () => { $('hanjaList').value = DEFAULT_TEXT; });
  $('saveBtn').addEventListener('click', () => {
    const { list, bad } = parseWords($('hanjaList').value);
    if (bad.length) {
      $('editorError').textContent = `${bad.join(', ')}번째 줄을 "한자,뜻,음" 형식으로 고쳐 주세요.`;
      return;
    }
    if (list.length === 0) {
      $('editorError').textContent = '문제를 한 개 이상 입력해 주세요.';
      return;
    }
    customWords = list;
    store(STORAGE_KEY, JSON.stringify(customWords));
    $('levelSelect').value = 'custom';
    store(LEVEL_KEY, 'custom');
    closeEditor();
  });

  // 브라우저는 사용자가 한 번 조작해야 소리를 허용하므로, 첫 입력 때 오디오를 미리 켜 둠
  ['keydown', 'pointerdown'].forEach(ev =>
    document.addEventListener(ev, getAudio, { once: true }));

  loadSettings();
  applyLevel();
  newProblem();
</script>
</body>
</html>
